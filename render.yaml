services:
  # ---------------------------------------------------------------------------
  # SmartQMS Enterprise - Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: smart-qms-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: WORKSPACE_MODE
        value: standard
      - key: DATABASE_URL
        value: sqlite:///./smart_qms.db

  # ---------------------------------------------------------------------------
  # SmartQMS Enterprise - Frontend Client (React / Vite Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: smart-qms-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
